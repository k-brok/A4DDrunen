<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- kaart 1: roze, licht gedraaid -->
  <g transform="rotate(-4 30 60)">
    <rect x="10" y="45" width="40" height="30" rx="8" fill="none" stroke="#E6007E" stroke-width="2.5" stroke-dasharray="3 3"/>
  </g>

  <!-- kaart 2: blauw, licht tegengesteld gedraaid -->
  <g transform="rotate(3 90 60)">
    <rect x="70" y="45" width="40" height="30" rx="8" fill="none" stroke="#2B9AC8" stroke-width="2.5" stroke-dasharray="3 3"/>
    <circle cx="90" cy="60" r="9" fill="#2B9AC8"/>
  </g>
</svg>
