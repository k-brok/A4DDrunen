  </g>

  <!-- Touw komt bovenop de vlaggetjes -->
  <path
    d="
      M0 8
      Q300 2 600 8
      Q900 14 1200 8
    "
    fill="none"
    stroke="#9B1B5A"
    stroke-width="2"
    opacity="0.4"
  />

</svg>