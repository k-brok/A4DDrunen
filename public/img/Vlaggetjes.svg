    <path d="M917.96 -18 L972.04 -18 L945 45 Z"
      fill="#8CB808" opacity="0.85"/>

    <path d="M983.25 -18 L1036.75 -18 L1010 44 Z"
      fill="#2B9AC8" opacity="0.85"/>

    <path d="M1048.77 -18 L1101.23 -18 L1075 43 Z"
